<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>speechie.hk 讀寫小組</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#fffff2;
    --card:#fff9e6;
    --ink:#3d2c2c;
    --ink-soft:#7a6060;
    --pink:#ff6b9d;
    --coral:#f0553c;
    --border:#f9c4d0;
    --shadow:0 6px 24px rgba(240,85,60,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(circle at 12% 18%, #ffe3ec 0, transparent 32%),
      radial-gradient(circle at 88% 8%, #fff3c9 0, transparent 30%),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.75;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .wrap{max-width:560px;width:100%;text-align:center}
  .kicker{
    font-size:14px;font-weight:700;letter-spacing:.18em;color:var(--pink);margin-bottom:10px;
  }
  h1{font-size:clamp(26px,6vw,38px);font-weight:900;line-height:1.4;margin-bottom:8px}
  .sub{color:var(--ink-soft);font-size:15.5px;margin-bottom:36px}
  .cards{display:grid;gap:16px}
  a.card{
    display:flex;align-items:center;gap:16px;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:20px;
    padding:20px 24px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(240,85,60,.14)}
  .emoji{font-size:32px;flex:none}
  .card b{font-size:18px;font-weight:900;display:block}
  .card span{font-size:14px;color:var(--ink-soft)}
  .arrow{margin-left:auto;color:var(--coral);font-weight:900;font-size:20px;flex:none}
  footer{margin-top:40px;font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">SPEECHIE.HK</div>
  <h1>讀寫小組</h1>
  <p class="sub">由言語治療師 Miss S 帶領　讓孩子開口 × 讓學習有方法</p>
  <div class="cards">
    <a class="card" href="k3.html"><span class="emoji">🔍</span><span><b>K3 讀寫預備班</b><span>升小前的讀寫準備</span></span><span class="arrow">→</span></a>
    <a class="card" href="p1.html"><span class="emoji">✏️</span><span><b>小一讀寫小組</b><span>認字打好基礎</span></span><span class="arrow">→</span></a>
    <a class="card" href="p2.html"><span class="emoji">✍🏻</span><span><b>小二讀寫小組</b><span>讀寫能力再提升</span></span><span class="arrow">→</span></a>
  </div>
  <footer>speechie.hk ｜ 讓孩子開口 × 讓學習有方法</footer>
</div>
</body>
</html>
